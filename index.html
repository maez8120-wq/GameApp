<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Shuffler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    background: #ffd60a;
    padding: 24px;
    text-align: center;
  }
  header h1 { font-size: 1.8rem; color: #1e3c72; }
  header p { color: #555; margin-top: 4px; font-size: 0.9rem; }
  .content { padding: 24px; }
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #2a5298; }
  button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-add { background: #2a5298; color: #fff; }
  .btn-shuffle { background: #ffd60a; color: #1e3c72; width: 100%; padding: 18px; font-size: 1.1rem; margin-top: 10px; }
  .btn-clear { background: #eee; color: #666; width: 100%; margin-top: 10px; padding: 12px; }
  .btn-remove {
    background: #ff4d4d;
    color: #fff;
    padding: 6px 12px;
    font-size: 0.85rem;
    border-radius: 6px;
  }
  h2 {
    font-size: 1.1rem;
    color: #1e3c72;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count-badge {
    background: #e8eefc;
    color: #2a5298;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.85rem;
  }
  ul { list-style: none; }
  #playerList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #f7f9fc;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 1rem;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .empty-msg {
    text-align: center;
    color: #999;
    padding: 30px;
    font-style: italic;
  }
  .match {
    background: #f7f9fc;
    border-left: 5px solid #2a5298;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    animation: fadeIn 0.4s;
  }
  .match-title {
    font-weight: 700;
    color: #2a5298;
    margin-bottom: 10px;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
  }
  .team {
    background: #fff;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    border: 2px solid #e0e7f5;
  }
  .team-label {
    font-size: 0.75rem;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .team-name { font-weight: 600; font-size: 0.95rem; }
  .vs {
    font-weight: 800;
    color: #ffd60a;
    background: #1e3c72;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
  }
  .bye {
    background: #fff8e1;
    border-left: 5px solid #ffd60a;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    color: #8a6d00;
    font-size: 0.9rem;
  }
  .section { margin-top: 24px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏓 Pickleball Shuffler</h1>
    <p>Add players, shuffle, and get your matches</p>
  </header>

  <div class="content">
    <div class="input-row">
      <input type="text" id="playerInput" placeholder="Enter player name..." maxlength="30">
      <button class="btn-add" onclick="addPlayer()">Add</button>
    </div>

    <h2>
      Players
      <span class="count-badge" id="countBadge">0</span>
    </h2>

    <ul id="playerList">
      <li class="empty-msg">No players yet. Add some above!</li>
    </ul>

    <button class="btn-shuffle" onclick="shufflePlayers()" id="shuffleBtn" disabled>
      🎲 Shuffle & Generate Matches
    </button>
    <button class="btn-clear" onclick="clearAll()">Clear All</button>

    <div class="section hidden" id="resultsSection">
      <h2>Matches</h2>
      <div id="matches"></div>
    </div>
  </div>
</div>

<script>
  let players = [];

  const input = document.getElementById('playerInput');

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addPlayer();
  });

  function addPlayer() {
    const name = input.value.trim();
    if (!name) return;
    if (players.some(p => p.toLowerCase() === name.toLowerCase())) {
      alert('That player is already added!');
      return;
    }
    players.push(name);
    input.value = '';
    input.focus();
    renderPlayers();
  }

  function removePlayer(index) {
    players.splice(index, 1);
    renderPlayers();
  }

  function renderPlayers() {
    const list = document.getElementById('playerList');
    const badge = document.getElementById('countBadge');
    const shuffleBtn = document.getElementById('shuffleBtn');

    badge.textContent = players.length;
    shuffleBtn.disabled = players.length < 4;

    if (players.length === 0) {
      list.innerHTML = '<li class="empty-msg">No players yet. Add some above!</li>';
      document.getElementById('resultsSection').classList.add('hidden');
      return;
    }

    list.innerHTML = players.map((p, i) =>
      `<li>
        <span>${escapeHtml(p)}</span>
        <button class="btn-remove" onclick="removePlayer(${i})">Remove</button>
      </li>`
    ).join('');
  }

  function shufflePlayers() {
    if (players.length < 4) {
      alert('You need at least 4 players to create a match!');
      return;
    }

    // Fisher-Yates shuffle
    const shuffled = [...players];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const matches = [];
    const byes = [];
    let i = 0;

    // Create matches of 4 players
    while (i + 3 < shuffled.length) {
      matches.push({
        team1: [shuffled[i], shuffled[i + 1]],
        team2: [shuffled[i + 2], shuffled[i + 3]]
      });
      i += 4;
    }

    // Remaining players sit out
    while (i < shuffled.length) {
      byes.push(shuffled[i]);
      i++;
    }

    renderMatches(matches, byes);
  }

  function renderMatches(matches, byes) {
    const section = document.getElementById('resultsSection');
    const container = document.getElementById('matches');

    let html = '';

    matches.forEach((m, idx) => {
      html += `
        <div class="match">
          <div class="match-title">Court ${idx + 1}</div>
          <div class="teams">
            <div class="team">
              <div class="team-label">Team A</div>
              <div class="team-name">${escapeHtml(m.team1[0])} &amp; ${escapeHtml(m.team1[1])}</div>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <div class="team-label">Team B</div>
              <div class="team-name">${escapeHtml(m.team2[0])} &amp; ${escapeHtml(m.team2[1])}</div>
            </div>
          </div>
        </div>
      `;
    });

    if (byes.length > 0) {
      html += `
        <div class="bye">
          <strong>⏸ Sitting out:</strong> ${byes.map(escapeHtml).join(', ')}
        </div>
      `;
    }

    container.innerHTML = html;
    section.classList.remove('hidden');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function clearAll() {
    if (players.length === 0) return;
    if (confirm('Remove all players?')) {
      players = [];
      renderPlayers();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderPlayers();
</script>
</body>
</html>
